# Quick start: docker compose -f src/docker/compose.yml up
name: tracker

services:
  app:
    build:
      context: ../..
      dockerfile: src/docker/Dockerfile
    environment:
      APP__DATABASE__URL: "postgres://app:${POSTGRES_PASSWORD:-app}@postgres:5432/app"
      APP__SEARCH__MEILI_URL: "http://meilisearch:7700"
      APP__SEARCH__MEILI_MASTER_KEY: "${MEILI_MASTER_KEY:-change-me-please-32-bytes-minimum}"
      APP__SERVER__BIND: "0.0.0.0:3000"
    env_file:
      - path: ../../config/.env
        required: false
    ports:
      - "3000:3000"
    volumes:
      - app-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-app}"
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.56.1
    environment:
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY:-change-me-please-32-bytes-minimum}"
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  app-data:
  pg-data:
  meili-data:
