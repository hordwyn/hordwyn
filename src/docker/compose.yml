# Quick start (see the "Install and first run" page of the docs):
#   cp config/.env.example config/.env     # set POSTGRES_PASSWORD and MEILI_MASTER_KEY
#   docker compose --env-file config/.env -f src/docker/compose.yml up -d
# There are no default passwords: compose refuses to start until both are set (SEC-6).
# The app is published on 127.0.0.1:3000 only; put a reverse proxy with TLS in front of it
# ("Behind a reverse proxy" in the docs), or set APP_PUBLISH_ADDR to a LAN address.
#
# Supported shape (OPS-12): ONE web process plus any number of workers. The default below is
# one process doing both (`--role=all`). Never start a second `--role=all` or a second
# `--role=web` process: events and sign-in throttles are per web process. To move the
# background work out of the web process, see the commented `worker` service.
#
# A second copy beside this one (restore rehearsal): another project name (`-p`), another
# host port (APP_PUBLISH_PORT) and another image name (APP_IMAGE); see "Restore rehearsal
# beside the live instance" on the Operations page.
name: tracker

services:
  app:
    # Every container of the project runs this one image (the worker below does not build
    # its own): two builds on one volume would disagree about the blob directory.
    image: "${APP_IMAGE:-localhost/tracker-app:local}"
    build:
      context: ../..
      dockerfile: src/docker/Dockerfile
      args:
        # parallel compile jobs in the image build; 1 on hosts with less than 8 GB free
        CARGO_BUILD_JOBS: "${CARGO_BUILD_JOBS:-2}"
    restart: unless-stopped
    # longer than jobs.shutdown_grace_secs (20 s): running jobs finish before SIGKILL (OPS-7)
    stop_grace_period: 30s
    # all (default): web and background work in one process; web: beside `worker` services
    command: ["--role=${APP_ROLE:-all}"]
    environment:
      APP__DATABASE__URL: "postgres://app:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in config/.env}@postgres:5432/app"
      APP__SEARCH__MEILI_URL: "http://meilisearch:7700"
      APP__SEARCH__MEILI_MASTER_KEY: "${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in config/.env (16 bytes or more)}"
      APP__SERVER__BIND: "0.0.0.0:3000"
    env_file:
      - path: ../../config/.env
        required: false
    ports:
      - "${APP_PUBLISH_ADDR:-127.0.0.1}:${APP_PUBLISH_PORT:-3000}:3000"
    volumes:
      - app-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      # migrations and the first source probes run before the port opens
      start_period: 60s

  # Optional: background work in its own process. Then run the app as the web process only
  # (set APP_ROLE=web in config/.env) and uncomment this service;
  # scale it with `--scale worker=2`. Keep exactly one web process. The worker serves no
  # port, so it has no healthcheck (it is seen through Admin > Overview, row "Jobs"). It runs
  # the image the `app` service builds: build with `build` (or `up --build`) before `up`,
  # and replace web process and workers together at an upgrade.
  # worker:
  #   image: "${APP_IMAGE:-localhost/tracker-app:local}"
  #   pull_policy: never
  #   command: ["--role=worker"]
  #   restart: unless-stopped
  #   stop_grace_period: 30s
  #   environment:
  #     APP__DATABASE__URL: "postgres://app:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in config/.env}@postgres:5432/app"
  #     APP__SEARCH__MEILI_URL: "http://meilisearch:7700"
  #     APP__SEARCH__MEILI_MASTER_KEY: "${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in config/.env (16 bytes or more)}"
  #   env_file:
  #     - path: ../../config/.env
  #       required: false
  #   volumes:
  #     - app-data:/data
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     meilisearch:
  #       condition: service_healthy

  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in config/.env}"
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.56.1
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in config/.env (16 bytes or more)}"
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Optional S3-compatible storage (RustFS): a file of its own, compose.s3.yml, because its
  # credentials are required variables too and compose checks them for every service of a
  # file, started or not.

volumes:
  app-data:
  pg-data:
  meili-data:
