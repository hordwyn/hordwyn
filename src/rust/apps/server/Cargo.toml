[package]
name = "server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
api.workspace = true
app.workspace = true
assets.workspace = true
async-trait.workspace = true
auth.workspace = true
axum.workspace = true
base64.workspace = true
blake3.workspace = true
brand.workspace = true
catalog-core.workspace = true
chrono.workspace = true
config.workspace = true
contracts.workspace = true
connectors.workspace = true
domain.workspace = true
getrandom.workspace = true
jobs.workspace = true
integrations = { workspace = true, features = ["pg"] }
serde_json.workspace = true
notify = { workspace = true, features = ["all"] }
kinds.workspace = true
leptos = { workspace = true, features = ["ssr"] }
leptos_axum.workspace = true
realtime.workspace = true
importers = { workspace = true, features = ["generic"] }
search.workspace = true
sqlx.workspace = true
store-pg.workspace = true
telemetry.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true
web = { workspace = true, features = ["ssr"] }

[features]
default = []
gallery = ["web/gallery"]
tmdb = ["connectors/tmdb"]
igdb = ["connectors/igdb"]
podcastindex = ["connectors/podcastindex"]
tvdb = ["connectors/tvdb"]
# every compiled-in connector (release builds, CI)
all-connectors = ["tmdb", "igdb", "podcastindex", "tvdb"]

[dev-dependencies]
wiremock.workspace = true
futures.workspace = true
reqwest = { workspace = true, features = ["json", "stream"] }
serde_json.workspace = true
testkit.workspace = true
tower = { version = "0.5", features = ["util"] }
