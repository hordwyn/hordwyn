[package]
name = "server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# one integration test binary, `tests/it/main.rs` (DEC-565): each test target links the whole server
autotests = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
tower = { version = "0.5", features = ["util"] }
# the listener loop (serve.rs) and the body limit of pages; all three are in the tree through axum
hyper = { version = "1.12", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio", "server-graceful", "service", "http1"] }
http-body-util = "0.1.5"
api.workspace = true
app.workspace = true
assets.workspace = true
async-trait.workspace = true
auth.workspace = true
axum.workspace = true
base64.workspace = true
blake3.workspace = true
brand.workspace = true
catalog-core.workspace = true
chrono.workspace = true
config.workspace = true
contracts.workspace = true
connectors.workspace = true
domain.workspace = true
futures.workspace = true
getrandom.workspace = true
jobs.workspace = true
integrations = { workspace = true, features = ["pg"] }
serde_json.workspace = true
notify = { workspace = true, features = ["all"] }
kinds.workspace = true
leptos = { workspace = true, features = ["ssr", "nonce"] }
leptos_axum.workspace = true
realtime.workspace = true
importers = { workspace = true, features = ["generic"] }
search.workspace = true
sqlx.workspace = true
store-pg.workspace = true
telemetry.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true
web = { workspace = true, features = ["ssr"] }

[[test]]
name = "it"
path = "tests/it/main.rs"

[features]
default = []
gallery = ["web/gallery"]
tmdb = ["connectors/tmdb"]
igdb = ["connectors/igdb"]
openlibrary = ["connectors/openlibrary"]
wikidata = ["connectors/wikidata"]
podcastindex = ["connectors/podcastindex"]
tvdb = ["connectors/tvdb"]
# every compiled-in connector (release builds, CI)
all-connectors = ["tmdb", "igdb", "podcastindex", "tvdb", "openlibrary", "wikidata"]

[dev-dependencies]
tracing-subscriber.workspace = true
totp-rs.workspace = true
wiremock.workspace = true
reqwest = { workspace = true, features = ["json", "stream"] }
serde_json.workspace = true
testkit.workspace = true
