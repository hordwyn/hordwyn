[[everything.points]]
id = "notifications"
status = "shipped"
icon = "bell"
title = "Notifications"
text = "An inbox in the application, with copies by e-mail, ntfy, Gotify, Discord, Matrix, Apprise or webhook."

[[everything.points]]
id = "integrations"
status = "shipped"
icon = "plug"
title = "Integrations"
text = "A media server or your own script can report watched movies and episodes through a webhook. There is a REST API."

[[everything.points]]
id = "accounts"
status = "shipped"
icon = "key-round"
title = "Accounts for your household"
text = "Several users per instance, invitations, two-factor sign-in and single sign-on with OpenID Connect."

