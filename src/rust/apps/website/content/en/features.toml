[[groups]]
heading = "Watch"

[[groups.items]]
kind = "movie"
title = "Movies"
text = "Find a movie, add it, mark it watched - again and again."
status = "shipped"
points = [
  "Search and add from TMDB",
  "Every viewing counts, with its own date",
  "\"Watched with ...\": note the people who were there",
  "Import your Trakt history from its JSON files; a media server can report what you watched through a webhook",
  "Statistics: movies and hours watched",
]
source = "TMDB"

[[groups.items]]
kind = "show"
title = "Shows"
text = "Episode tracking that copes with real viewing habits."
status = "shipped"
points = [
  "Search and add from TMDB, and from TheTVDB with your own key",
  "Mark single episodes, a whole season or everything up to an episode",
  "Rewatch runs are kept apart from the first viewing",
  "\"Watched with ...\" for episodes too",
  "Statistics: episodes, and hours where the source gives a runtime",
]
source = "TMDB, TheTVDB"

