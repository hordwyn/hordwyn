[name]
eyebrow = "Why the name"
heading = "The joy of the hoard"
gloss = "<i lang=\"ang\">hord-wynn</i>: \"joy of the hoard\""
body = """
{name} comes from an Old English word. <i lang="ang">Hord</i> is a hoard, a treasure kept safe; <i lang="ang">wynn</i> is joy. Together, <i lang="ang">hord-wynn</i> means the joy of the hoard: a treasure that delights whoever holds it.

The word survives in a single place: line 2270 of *Beowulf*, where the old dragon finds a hoard-joy standing open and takes it for his own. He then guards it under a barrow for three hundred winters, alone.

We like the word and think the dragon got it wrong. Your hoard is the stories and games you treasure - and the joy is in sharing them with your people: the film night, the book you pressed into a friend's hands, the game that kept the whole table up past midnight. {name} keeps the hoard and remembers who was there.

The spelling drops the second n of the dictionary form. Say it HORD-win.
"""
sources = """
Meaning and attestation: [Brunetti, short definitions for *Beowulf* (Scaife ATLAS)](https://atlas.perseus.tufts.edu/dictionaries/entry/urn:cite2:scaife-viewer:dictionary-entries.atlas_v1:ang-short-def-1632) (<i lang="ang">hord-wynn</i>, "joy of the hoard"); [A Consolidated Library of Anglo-Saxon Poetry](https://clasp.ell.ox.ac.uk/db-latest/word/hordwynne) (one occurrence, *Beowulf* 2270).
"""

[[name.parts]]
part = "hord"
meaning = "hoard, treasure"

[[name.parts]]
part = "wynn"
meaning = "joy, delight"

[selfhost.intro]
eyebrow = "Self-hosting"
heading = "Runs on your own server"
text = "One compose file starts the application, Postgres and Meilisearch on one host. Nothing phones home; the only outgoing calls go to the data sources you switch on."

[[selfhost.steps]]
title = "Set two secrets"
text = "Copy the example environment file and set a database password and a search key."

[[selfhost.steps]]
title = "Start it"
text = "Docker Compose or Podman Compose builds the image from the source and starts the three services."

[[selfhost.steps]]
title = "Open it"
text = "Put your reverse proxy with TLS in front, open the address and create the first account in the setup wizard."

[selfhost]
more = { label = "Self-hosting guide", href = "{root}/self-hosting/" }

[hub.intro]
eyebrow = "After v1"
heading = "An open catalogue hub is planned"
text = "Some things have no good open catalogue yet, board games above all. The {name} hub is planned as a shared, openly licensed catalogue that instances can read from and contribute to. It is not built yet."

[hub]
more = { label = "About the hub", href = "{root}/hub/" }

