[together.intro]
eyebrow = "With whom"
heading = "The evening matters as much as the title"
text = "Most trackers know what you watched. {name} also knows who sat next to you."

[[together.points]]
icon = "users"
title = "Your people"
text = "Keep your own address book of the people you watch, read and play with. They need no account."

[[together.points]]
icon = "link"
title = "Linked when they join"
text = "When a friend gets an account on your instance, link them: sessions you shared appear in their history, and they can copy them into their own log."

[[together.points]]
icon = "trophy"
title = "Plays, scores, winners"
text = "A game night is logged with its players, scores and winner - or as a co-op game you won or lost together."

[[together.points]]
icon = "history"
title = "A history worth rereading"
text = "Every viewing and every play is kept with its date and its company, so a year of evenings can be read back."

