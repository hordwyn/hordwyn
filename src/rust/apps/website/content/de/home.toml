[name]
eyebrow = "Warum der Name"
heading = "Die Freude am Hort"
gloss = "<i lang=\"ang\">hord-wynn</i>: \"Freude am Hort\""
body = """
{name} kommt von einem altenglischen Wort. <i lang="ang">Hord</i> ist der Hort, ein gut verwahrter Schatz; <i lang="ang">wynn</i> ist die Freude, verwandt mit dem deutschen Wort Wonne. Zusammen bedeutet <i lang="ang">hord-wynn</i> die Freude am Hort: ein Schatz, der die erfreut, die ihn besitzen.

Das Wort ist an einer einzigen Stelle überliefert: in Zeile 2270 des *Beowulf*. Dort findet der alte Drache eine solche Hortfreude offen daliegen und nimmt sie in Besitz. Dann bewacht er sie dreihundert Winter lang unter einem Hügelgrab, allein.

Wir mögen das Wort und finden, der Drache hat es falsch verstanden. Dein Hort sind die Geschichten und Spiele, die dir wichtig sind - und die Freude liegt darin, sie mit deinen Leuten zu teilen: der Filmabend, das Buch, das du einer Freundin in die Hand gedrückt hast, das Spiel, das den ganzen Tisch bis nach Mitternacht wachgehalten hat. {name} hütet den Hort und merkt sich, wer dabei war.

Die Schreibweise lässt das zweite n der Wörterbuchform weg. Gesprochen wird es HORD-win.
"""
sources = """
Bedeutung und Beleg: <a href="https://atlas.perseus.tufts.edu/dictionaries/entry/urn:cite2:scaife-viewer:dictionary-entries.atlas_v1:ang-short-def-1632" hreflang="en" lang="en">Brunetti, short definitions for <em>Beowulf</em> (Scaife ATLAS)</a> (<i lang="ang">hord-wynn</i>, <span lang="en">"joy of the hoard"</span>); <a href="https://clasp.ell.ox.ac.uk/db-latest/word/hordwynne" hreflang="en" lang="en">A Consolidated Library of Anglo-Saxon Poetry</a> (ein Beleg, *Beowulf* 2270).
"""

[[name.parts]]
part = "hord"
meaning = "Hort, Schatz"

[[name.parts]]
part = "wynn"
meaning = "Freude, Wonne"

[selfhost]
more = { label = "Anleitung zum Selbsthosten", href = "{root}/self-hosting/" }

[selfhost.intro]
eyebrow = "Selbst hosten"
heading = "Läuft auf deinem eigenen Server"
text = "Eine Compose-Datei startet die Anwendung, Postgres und Meilisearch auf einem Host. Nichts meldet sich nach außen; ausgehende Anfragen gehen nur an die Datenquellen, die du einschaltest."

[[selfhost.steps]]
title = "Zwei Geheimnisse setzen"
text = "Kopiere die Beispiel-Umgebungsdatei und setze ein Datenbankpasswort und einen Suchschlüssel."

[[selfhost.steps]]
title = "Starten"
text = "Docker Compose oder Podman Compose baut das Image aus dem Quelltext und startet die drei Dienste."

[[selfhost.steps]]
title = "Öffnen"
text = "Stelle deinen Reverse Proxy mit TLS davor, öffne die Adresse und lege im Einrichtungsassistenten das erste Konto an."

[hub]
more = { label = "Über den Hub", href = "{root}/hub/" }

[hub.intro]
eyebrow = "Nach v1"
heading = "Ein offener Katalog-Hub ist geplant"
text = "Für manches gibt es noch keinen guten offenen Katalog, vor allem für Brettspiele. Der {name}-Hub ist als gemeinsamer, offen lizenzierter Katalog geplant, aus dem Instanzen lesen und zu dem sie beitragen können. Er ist noch nicht gebaut."

[closing]
