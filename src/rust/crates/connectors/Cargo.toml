[package]
name = "connectors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
app.workspace = true
domain.workspace = true
kinds.workspace = true
catalog-core.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono = { workspace = true, features = ["clock"] }
url.workspace = true
tracing.workspace = true
sha1 = { version = "0.10.7", optional = true }
blake3 = { workspace = true, optional = true }

[features]
default = []
tmdb = []
igdb = []
openlibrary = []
wikidata = []
podcastindex = ["dep:sha1"]
tvdb = ["dep:blake3"]
# every connector (CI, server builds)
all = ["tmdb", "igdb", "podcastindex", "tvdb", "openlibrary", "wikidata"]

[dev-dependencies]
testkit.workspace = true
tokio.workspace = true
