[package]
name = "importers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
app.workspace = true
async-trait.workspace = true
blake3.workspace = true
chrono.workspace = true
csv = { version = "1.4.0", optional = true }
domain.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true
uuid.workspace = true

[features]
default = ["trakt-import"]
# our own documented format (JSON Lines and CSV), also used by the export
generic = ["dep:csv"]
# the user's own Trakt JSON files (docs/connectors/trakt.md, DEC-297): no network calls
trakt-import = []
all = ["generic", "trakt-import"]

[dev-dependencies]
store-pg.workspace = true
testkit.workspace = true
kinds.workspace = true
sqlx.workspace = true
tokio.workspace = true
