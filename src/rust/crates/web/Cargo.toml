[package]
name = "web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
ui.workspace = true
contracts.workspace = true
leptos.workspace = true
leptos_router.workspace = true
leptos_meta.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
thumbhash.workspace = true
uuid = { workspace = true, features = ["js"] }
fluent-bundle.workspace = true
unic-langid.workspace = true
console_error_panic_hook = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
send_wrapper = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["EventSource", "MessageEvent", "Location", "Window", "Document", "Element", "HtmlElement", "HtmlFormElement", "Storage", "MediaQueryList", "DomTokenList", "Navigator", "Node", "NodeList", "EventTarget", "KeyboardEvent", "PointerEvent", "Request", "RequestInit", "RequestCredentials", "Response", "Headers", "History", "UrlSearchParams", "File", "FileList", "HtmlInputElement", "Blob", "DataTransfer", "DragEvent", "DomRect", "VisibilityState"] }
# server side only
brand = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
leptos_axum = { workspace = true, optional = true }

[features]
default = []
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:brand",
    "dep:async-trait",
    "dep:axum",
    "dep:leptos_axum",
]
hydrate = ["leptos/hydrate", "dep:console_error_panic_hook", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:send_wrapper", "dep:web-sys"]
csr = ["leptos/csr"]
# dev-only component gallery at /dev/gallery
gallery = []
