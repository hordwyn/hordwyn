[package]
name = "ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lints]
workspace = true

[dependencies]
leptos.workspace = true
web-sys = { workspace = true, features = ["KeyboardEventInit", "HtmlElement", "Element", "Document", "Window", "Storage", "DomTokenList", "Node", "NodeList", "KeyboardEvent", "FocusEvent", "MouseEvent", "Navigator", "Clipboard", "HtmlInputElement", "HtmlDetailsElement", "Performance"] }

# Render tests run natively with `ssr`; browser tests run on wasm with `csr`. The features must
# not mix, so each target gets its own dev-dependency.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
leptos = { workspace = true, features = ["csr"] }
wasm-bindgen-test.workspace = true
wasm-bindgen.workspace = true
