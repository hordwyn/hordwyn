[workspace]
resolver = "3"
members = ["apps/*", "crates/*", "xtask"]
default-members = ["apps/*", "crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
# workspace crates
domain = { path = "crates/domain" }
app = { path = "crates/app" }
contracts = { path = "crates/contracts" }
kinds = { path = "crates/kinds" }
store-pg = { path = "crates/store-pg" }
search = { path = "crates/search" }
jobs = { path = "crates/jobs" }
realtime = { path = "crates/realtime" }
catalog-core = { path = "crates/catalog-core" }
connectors = { path = "crates/connectors" }
assets = { path = "crates/assets" }
importers = { path = "crates/importers" }
integrations = { path = "crates/integrations" }
notify = { path = "crates/notify" }
auth = { path = "crates/auth" }
brand = { path = "crates/brand" }
config = { path = "crates/config" }
telemetry = { path = "crates/telemetry" }
testkit = { path = "crates/testkit" }
ui = { path = "crates/ui" }
web = { path = "crates/web" }
api = { path = "crates/api" }

# third party (versions checked on crates.io 2026-11-05, see docs/DECISIONS.md)
anyhow = "1.0.104"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1.20"
uuid = { version = "1.29.0", features = ["v5", "v7", "serde"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tracing = "0.1.44"
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
async-trait = "0.1.92"
schemars = { version = "1.2.3", features = ["chrono04"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
tokio-util = "0.7.20"
fastrand = "2.5.0"
croner = "4.0.3"
# gzip: API:Etiquette (Wikidata) asks for compressed transfer; decoded before parse and cache (LB-38)
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "gzip"] }
governor = "0.10.4"
blake3 = "1.8.7"
httpdate = "1.0.3"
url = "2.5.8"
wiremock = "0.6.5"
leptos = "0.8.23"
leptos_router = "0.8.17"
leptos_meta = "0.8.7"
leptos_axum = "0.8.10"
axum = "0.8.9"
console_error_panic_hook = "0.1.7"
wasm-bindgen-test = "0.3.80"
web-sys = "0.3.107"
# already in the tree through web-sys and leptos (phase 3 WP3-4: browser fetch, Intl)
js-sys = "0.3.107"
wasm-bindgen-futures = "0.4.80"
send_wrapper = { version = "0.6.0", features = ["futures"] }
cargo_metadata = "0.23"
# must match wasm-bindgen-cli in flake.nix
wasm-bindgen = "=0.2.130"
# assets (versions checked on crates.io 2026-11-06)
opendal = { version = "0.59.5", default-features = false, features = ["services-fs", "services-s3", "services-memory", "executors-tokio", "http-transport-reqwest"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "avif"] }
fast_image_resize = { version = "6.1.0", features = ["image"] }
thumbhash = "0.1.0"
webp = { version = "0.3.1", default-features = false }
rayon = "1.12.0"
fs4 = "1.1.0"
proptest = "1.12.0"
toml = "1.2.0"
# auth, api, realtime, server (versions checked on crates.io 2026-11-06)
argon2 = "0.6.0"
totp-rs = { version = "6.0.0", features = ["otpauth"] }
openidconnect = { version = "4.1.0", default-features = false }
http = "1.3"
getrandom = "0.4.3"
base64 = "0.22.1"
utoipa = "6.0.0"
utoipa-axum = "0.3.0"
futures = "0.3.34"
tokio-stream = { version = "0.1.19", features = ["sync"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }
fluent-bundle = "0.16.0"
# AST of .ftl files for the locale parity checks (the version fluent-bundle uses)
fluent-syntax = "0.12.0"
unic-langid = "0.9.6"
meilisearch-sdk = { version = "0.33.0", default-features = false, features = ["reqwest", "tls"] }
# secrets at rest (addendum-1 2.2, OD-05): RustCrypto, Apache-2.0 OR MIT (crates.io 2026-11-07)
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
zeroize = "1.9.1"
# OIDC (WP3-2, DEC-308): pending-cookie key and MAC (addendum-1 2.2 `cookie_key`), RustCrypto,
# MIT OR Apache-2.0, already in the lock file (sqlx-postgres, totp-rs, openidconnect); rsa only for the
# testkit issuer key
hkdf = "0.13.0"
hmac = "0.13.0"
sha2 = "0.11.1"
rsa = { version = "0.9.10", features = ["getrandom", "sha2"] }

# Small target dirs (DEC-055): line tables for our code (backtraces), no debug info for deps.
[profile.dev]
debug = "line-tables-only"
# Linked test binaries carry std's debug info (up to 200 MB each); strip it (DEC-091).
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# cargo-leptos. Production: `cargo leptos build --release`. Dev and e2e add the component gallery:
# `--bin-features gallery --lib-features hydrate,gallery` (see xtask dev/e2e).
[[workspace.metadata.leptos]]
name = "app"
output-name = "app"
bin-package = "server"
lib-package = "web"
site-root = "target/site"
site-pkg-dir = "pkg"
# content hashes in the names of the bundle files (OPS-8, DEC-536): cacheable for good
hash-files = true
tailwind-input-file = "../web/style/input.css"
assets-dir = "../web/public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
end2end-cmd = "npx playwright test"
end2end-dir = "../web"
browserquery = "defaults"
env = "DEV"
bin-features = ["all-connectors"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
