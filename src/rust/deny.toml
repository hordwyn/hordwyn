# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/, checked against 0.20.2)

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# paste is unmaintained (not vulnerable); it comes in through leptos -> either_of (DEC-044).
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "transitive via leptos 0.8; compile-time macro only" },
    # rsa via openidconnect: only public-key signature verification of ID tokens, no private
    # key exists in the server process, so the timing side channel has nothing to leak
    # (DEC-082). The only private key is the throw-away key of the testkit OIDC issuer
    # (dev-dependency, tests only, DEC-308).
    { id = "RUSTSEC-2023-0071", reason = "rsa verifies OIDC ID-token signatures with public keys; signing only in testkit tests" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# GPL, AGPL, LGPL, SSPL and BUSL are not listed and therefore denied.
allow = [
    "MIT",
    "MIT-0",
    # BSD Zero Clause (quoted_printable via lettre), more permissive than MIT, DEC-144
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    # Boost Software License 1.0 (permissive; not the BUSL source-available licence), DEC-044
    "BSL-1.0",
    # file-level copyleft only; every MPL-2.0 dependency is listed in docs/DECISIONS.md (DEC-005)
    "MPL-2.0",
]

# Mozilla root CA data used by rustls-platform-verifier; permissive data licence (DEC-036).
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

# The same Mozilla root data, via reqwest 0.12 in meilisearch-sdk (DEC-083).
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

# rav1e (AVIF encoder) lists libfuzzer-sys for its fuzzing cfg only; it is never built for our
# targets (`cargo tree -i libfuzzer-sys` is empty). NCSA is permissive (OSI, FSF free), DEC-065.
[[licenses.exceptions]]
crate = "libfuzzer-sys"
allow = ["NCSA"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
