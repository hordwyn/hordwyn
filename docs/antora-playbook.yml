site:
  title: Hordwyn documentation
  start_page: tracker::index.adoc
content:
  sources:
    - url: ./..
      branches: HEAD
      start_path: docs
asciidoc:
  extensions:
    - asciidoctor-kroki
  attributes:
    kroki-fetch-diagram: false
ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
output:
  dir: ../build/site
